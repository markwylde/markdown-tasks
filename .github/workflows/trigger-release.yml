name: Trigger Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trigger-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --release --locked
      - run: python3 -m unittest scripts/test_release_tools.py
      - uses: EmbarkStudios/cargo-deny-action@v2

  release:
    name: Create draft release
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or resume semantic release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(git tag --points-at HEAD --list 'v[0-9]*' --sort=-version:refname | head -1)"
          if [[ -z "$TAG" ]]; then
            LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
            if [[ -n "$LATEST_TAG" ]] && gh release view "$LATEST_TAG" >/dev/null 2>&1; then
              LATEST_DRAFT="$(gh release view "$LATEST_TAG" --json isDraft --jq .isDraft)"
              if [[ "$LATEST_DRAFT" == "true" ]]; then
                TAG="$LATEST_TAG"
                echo "Resuming unfinished draft release $TAG."
              fi
            fi
          fi
          if [[ -n "$TAG" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
              if [[ "$DRAFT" != "true" ]]; then
                echo "Release $TAG is already published; there is nothing to do."
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Resuming draft release $TAG."
            else
              gh release create "$TAG" --draft --target "$GITHUB_SHA" \
                --title "$TAG" --notes "Release build in progress."
            fi
          else
            TAG="$(python3 scripts/release_tools.py next-tag)"
            if [[ -z "$TAG" ]]; then
              echo "No commits exist after the latest release."
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes "Release build in progress."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Generate release notes with DeepSeek Pro
        if: steps.release.outputs.skip == 'false'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_MODEL: deepseek/deepseek-v4-pro
        run: python3 scripts/release_tools.py generate-notes "${{ steps.release.outputs.tag }}"
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.skip == 'false'
        with:
          name: release-notes
          path: RELEASE.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: release
    if: needs.release.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: mdt
            format: tar.gz
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            binary: mdt
            format: tar.gz
          - label: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mdt
            format: tar.gz
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: mdt
            format: tar.gz
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mdt.exe
            format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Stamp release version
        shell: bash
        run: python3 scripts/release_tools.py sync-version "${{ needs.release.outputs.tag }}"
      - name: Build native binary
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify and package binary
        shell: bash
        run: |
          set -euo pipefail
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          VERSION="${{ needs.release.outputs.tag }}"
          "$BINARY" --version | grep -F "${VERSION#v}"
          python3 scripts/release_tools.py package \
            --tag "$VERSION" \
            --target "${{ matrix.target }}" \
            --binary "$BINARY" \
            --format "${{ matrix.format }}" \
            --output-dir dist
          if [[ "${{ matrix.format }}" == "tar.gz" ]]; then
            VERIFY_DIR="$RUNNER_TEMP/mdt-verify-${{ matrix.target }}"
            mkdir -p "$VERIFY_DIR"
            tar -xzf "dist/mdt-$VERSION-${{ matrix.target }}.tar.gz" -C "$VERIFY_DIR"
            PACKAGED="$VERIFY_DIR/mdt-$VERSION-${{ matrix.target }}/mdt"
            test -x "$PACKAGED"
            "$PACKAGED" --version | grep -F "${VERSION#v}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mdt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Attach assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/* --clobber

  publish:
    name: Publish release
    needs: [release, build]
    if: needs.release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Verify completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "${{ needs.release.outputs.tag }}" --json assets --jq '.assets | length')" -eq 10
          test "$(gh release view "${{ needs.release.outputs.tag }}" --json isDraft --jq .isDraft)" = true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --notes-file RELEASE.md --draft=false
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "${{ needs.release.outputs.tag }}" --json isDraft --jq .isDraft)" = false
          gh release view "${{ needs.release.outputs.tag }}" --json url --jq .url
